[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genealogy-workspace"
version = "0.5.1"
description = "Evidence-based, AI-assisted genealogy research toolkit, validator, interactive viewer, and plugin"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/rrhett/genealogy"
Repository = "https://github.com/rrhett/genealogy"

[project.scripts]
genealogy = "genealogy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genealogy"]

[tool.hatch.build.targets.wheel.force-include]
"plugin" = "genealogy/_bundled_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
