name: Release Genealogy Toolkit & Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "$TAG_VER" != "$PKG_VER" ]]; then
            echo "Tag version ($TAG_VER) does not match pyproject.toml ($PKG_VER)" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint code
        run: uv run ruff check src tests plugin/hooks

      - name: Run unit & integration tests
        run: uv run pytest -v

      - name: Validate worked example (examples/west-family)
        run: uv run genealogy validate --root examples/west-family --strict

      - name: Build wheel and sdist
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
