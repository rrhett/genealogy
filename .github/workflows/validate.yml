name: Validate Genealogy Toolkit & Plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint code
        run: uv run ruff check src tests plugin/hooks

      - name: Run unit & integration tests
        run: uv run pytest -v

      - name: Validate worked example (examples/west-family)
        run: uv run genealogy validate --root examples/west-family --strict

      - name: Verify wheel bundles plugin assets
        run: uv build
